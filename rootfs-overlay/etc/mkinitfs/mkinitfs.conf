# /etc/mkinitfs/mkinitfs.conf — CPZ-Alpine
#
# NOTE (v0.1): the stock 6.18.33+rpt-rpi-v8 kernel builds in ext4, the whole
# MMC/SD stack and dwc2, so the root filesystem mounts WITHOUT an initramfs.
# The console panel chain is instead loaded by OpenRC's `modules` service
# (see /etc/modules) — the documented R2 fallback in PLAN.md. fbcon appears
# a few seconds into OpenRC boot.
#
# This config is kept for Stage 03 (G1 polish): when we move the panel chain
# into early userspace, rebuild with:
#     mkinitfs 6.18.33+rpt-rpi-v8
# and copy /boot/initramfs-* onto the FAT partition as `initramfs8`
# (config.txt already has auto_initramfs=1).

features="base ext4 mmc"
modules="spi_bcm2835 pwm_bcm2835 fbtft st7789v_m5stack backlight pwm_bl_m5stack matrix-keymap tca8418_keypad_m5stack i2c_bcm2835"
